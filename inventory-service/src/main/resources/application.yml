spring:
  application:
    name: inventory-service
  PROFILES:
    ACTIVE: ${ACTIVE_PROFILES:dev}

server:
  port: 8081


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
