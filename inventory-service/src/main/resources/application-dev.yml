spring:
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true