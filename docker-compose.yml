services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql


  redis:
    image: redis:latest
    container_name: redis-cart
    ports:
      - "6379:6379"
    volumes:
      - radis-data:/data


volumes:
  mysql_data:
  radis-data: