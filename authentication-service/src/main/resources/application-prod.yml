spring:
  datasource:
    url: jdbc:${DB_TYPE}://${DB_HOSTNAME}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


jwt:
  secret:
    key: ${SECRET_KEY}