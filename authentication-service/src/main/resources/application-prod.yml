spring:
  datasource:
    url: ${DB_URL}
#    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


jwt:
  secret:
    key: ${SECRET_KEY}