name: Product Service CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main

jobs:
  build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Giving maven wrapper(mvnw) permission to execute
        working-directory: product-service
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: product-service
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test

  build-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make mvnw executable
        working-directory: product-service
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: product-service
        run: ./mvnw clean package

      - name: Build docker image
        working-directory: product-service
        run: docker build -t product-service:latest .

