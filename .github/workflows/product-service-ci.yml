name: Product Service CI/CD

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and Test
        working-directory: ./product-service
        run: mvn clean package -Dspring.profiles.active=test