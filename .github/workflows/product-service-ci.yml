name: Product Service CI/CD

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'product-service/**'

  push:
    branches:
      - develop
    paths:
      - 'product-service/**'

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        working-directory: ./product-service
        run: mvn clean package -Dspring.profiles.active=test

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service-jar
          path: product-service/target/*.jar