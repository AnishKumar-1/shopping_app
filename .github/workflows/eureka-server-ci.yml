name: EUREKA-SERVER

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - main
    paths:
      - 'eureka-server/**'
      - '.github/workflows/eureka-server-ci.yml'

jobs:

  check-changes:
    runs-on: ubuntu-latest

    outputs:
      eureka: ${{ steps.filter.outputs.eureka }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            eureka:
              - 'eureka-server/**'
              - '.github/workflows/eureka-server-ci.yml'

  eureka-build-test:
    if: github.event_name == 'pull_request' && needs.check-changes.outputs.eureka == 'true'
    needs: check-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give maven wrapper permission
        working-directory: eureka-server
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: eureka-server
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test

  build-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give maven wrapper permission
        working-directory: eureka-server
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: eureka-server
        run: ./mvnw clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: eureka_server
          IMAGE_TAG: latest
        working-directory: eureka-server
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG