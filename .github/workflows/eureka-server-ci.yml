name: EUREKA-SERVER

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'eureka-server/**'

  push:
    branches:
      - main
    paths:
      - 'eureka-server/**'

jobs:
  build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give maven wrapper (mvnw) file permission to execute
        working-directory: eureka-server
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: eureka-server
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test

  build-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give maven wrapper (mvnw) file permission to execute
        working-directory: eureka-server
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: eureka-server
        run: ./mvnw clean package

      - name: Build Docker Image
        working-directory: eureka-server
        run: docker build -t eureka-server:latest .