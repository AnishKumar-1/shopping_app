name: PAYMENT-SERVICE

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - main
    paths:
      - 'payment-service/**'
      - '.github/workflows/payment-service-ci.yml'

jobs:

  check-changes:
    runs-on: ubuntu-latest

    outputs:
      payment: ${{ steps.filter.outputs.payment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            payment:
              - 'payment-service/**'
              - '.github/workflows/payment-service-ci.yml'

  payment-build-test:
    if: github.event_name == 'pull_request' && needs.check-changes.outputs.payment == 'true'
    needs: check-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give maven wrapper permission
        working-directory: payment-service
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: payment-service
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test

  build-docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give maven wrapper permission
        working-directory: payment-service
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: payment-service
        run: ./mvnw clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: payment_service
          IMAGE_TAG: latest
        working-directory: payment-service
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG