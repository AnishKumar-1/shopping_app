name: AUTHENTICATION CI SERVICE
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - main

jobs:
  build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Give maven wrapper (mvnw) file permission to execute
        working-directory: authentication-service
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: authentication-service
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw clean test

  build-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Give maven wrapper (mvnw) file permission to execute
        working-directory: authentication-service
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: authentication-service
        run: ./mvnw clean package

      - name: Build image
        working-directory: authentication-service
        run: docker build -t authentication-service:latest .
