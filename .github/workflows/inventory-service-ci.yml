name: Inventory Service CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - main

jobs:
  build-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: inventory-service
        run: ./mvnw clean test



  build-docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR
        working-directory: inventory-service
        run: ./mvnw clean package

      - name: Build image
        working-directory: inventory-service
        run: docker build -t inventory-service:latest .
